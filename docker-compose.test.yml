version: "3.8"

services:
  # PostgreSQL for local ephemeral testing
  postgres-test:
    image: postgres:16-alpine
    container_name: ossaas-test-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: test_db
    ports:
      - "5434:5432"
    tmpfs:
      # Use in-memory DB for extreme speed on local tests
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5
