name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  type-check:
    name: TypeScript
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm type-check

  build:
    name: Build
    needs: type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
        env:
          # Required for Next.js build (Prisma schema generation and static analysis)
          DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2xlcmstYXV0ZXZvLTIyLmNsZXJrLmFjY291bnR0cy5kZXYk"
          CLERK_SECRET_KEY: "sk_test_51MzS2ZKG8n9YREp8K8p8K8p8K8p8K8p8K8p8K8p8K8p8K8p8K8p8K8p8K8p8"
          CLERK_WEBHOOK_SECRET: "whsec_placeholder"
          UPSTASH_REDIS_REST_URL: "https://placeholder.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "placeholder"
          ENCRYPTION_KEY: "placeholder-key-for-ci-build"
          STRIPE_SECRET_KEY: "sk_test_placeholder"
          STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
          STRIPE_PRICE_ID_STANDARD: "price_placeholder"
          STRIPE_PRICE_ID_FOUNDER: "price_placeholder"
          CRON_SECRET: "placeholder"
          SENTRY_AUTH_TOKEN: "placeholder"

  test-integration:
    name: Core Integration Tests
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Test DB
        run: pnpm --filter database db:push
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/test_db"

      - name: Run Vitest (Unit & Integration)
        run: pnpm --filter web run test
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/test_db"

  test-e2e:
    name: E2E UI Tests (Playwright)
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: e2e_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Setup E2E DB
        run: pnpm --filter database db:push
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/e2e_db"

      - name: Seed E2E DB with Clerk User
        run: pnpm exec tsx apps/web/e2e/seed-e2e.ts
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/e2e_db"
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Build App for E2E
        run: pnpm build
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/e2e_db"
          # Mock variables enough to pass static generation
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_Y2xlcmstYXV0ZXZvLTIyLmNsZXJrLmFjY291bnR0cy5kZXYk"
          CLERK_SECRET_KEY: "sk_test_placeholder"
          CLERK_WEBHOOK_SECRET: "whsec_placeholder"
          UPSTASH_REDIS_REST_URL: "https://placeholder.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "placeholder"
          ENCRYPTION_KEY: "placeholder-key-for-ci-build"
          STRIPE_SECRET_KEY: "sk_test_placeholder"
          STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
          STRIPE_PRICE_ID_STANDARD: "price_placeholder"
          STRIPE_PRICE_ID_FOUNDER: "price_placeholder"

      - name: Run Playwright Tests
        run: |
          pnpm --filter web start &
          sleep 10
          pnpm --filter web run test:e2e
        env:
          DATABASE_URL: "postgresql://user:pass@localhost:5432/e2e_db"
          PLAYWRIGHT_TEST_BASE_URL: "http://localhost:3000"
          # Next.js Server requires the real Secret Key to boot and validate the injected session cookies
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
